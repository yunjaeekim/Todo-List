<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoList</title>

  <link rel="stylesheet" href="style_v2.css">
  <script src="app_v2.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>TodoList</h1>
      <p class="description">오늘 해야 할 일을 입력하고 관리해 봅니다.</p>
    </header>

    <form id="todoForm" class="todo-form" novalidate>
      <label class="sr-only" for="todoInput">할 일</label>
      <input
        type="text"
        id="todoInput"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
        maxlength="100"
        required
      >
      <button type="submit">추가</button>
    </form>

    <section class="todo-toolbar" aria-label="할 일 목록 도구">
      <p id="remainingCount" class="remaining-count">남은 할 일 0개</p>

      <div class="todo-filters" role="group" aria-label="할 일 필터">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button type="button" data-filter="completed" aria-pressed="false">완료</button>
      </div>
    </section>

    <ul id="todoList" class="todo-list" aria-label="할 일 목록"></ul>

    <p id="statusMessage" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <div id="undoToast" class="undo-toast" role="status" aria-live="polite" hidden>
    <span id="undoMessage">할 일을 삭제했습니다.</span>
    <button id="undoButton" type="button">실행 취소</button>
  </div>
</body>
</html>
